<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:title" content="TURTLENECK WORLD 🐢">
<meta property="og:description" content="Jump into a shared TURTLENECK block world with friends.">
<meta name="theme-color" content="#111111">
<title>TURTLENECK WORLD 🐢</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101418;font-family:Arial,sans-serif}
#hud{position:fixed;z-index:10;left:14px;top:14px;color:#fff;text-shadow:0 2px 4px #000;font-size:14px;line-height:1.45}
#brand{font-weight:900;font-size:18px;letter-spacing:.5px}#worldLabel{opacity:.8;font-size:12px}
#crosshair{position:fixed;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:24px;text-shadow:0 1px 3px #000;pointer-events:none}
#panel{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(8,10,12,.9),rgba(24,30,36,.78))}
#card{width:min(440px,90vw);padding:28px;border-radius:22px;background:#fff;box-shadow:0 20px 70px rgba(0,0,0,.45)}
#card h1{margin:0 0 8px;font-size:30px}#card p{color:#555;line-height:1.45}
input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;border:1px solid #ccc;font-size:16px}button{margin-top:10px;background:#111;color:#fff;border:0;cursor:pointer;font-weight:700}button.secondary{background:#eee;color:#111}
#status{margin-top:10px;font-size:13px;color:#666;min-height:18px}#share{display:none;margin-top:10px}
#players{position:fixed;right:14px;top:14px;z-index:10;color:#fff;text-shadow:0 2px 4px #000;text-align:right}
#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;color:#fff;text-shadow:0 2px 4px #000;font-size:13px;white-space:nowrap}
#chat{position:fixed;z-index:12;left:14px;bottom:38px;width:min(330px,42vw);color:white;text-shadow:0 1px 3px #000;font-size:13px;pointer-events:none}
#messages{max-height:120px;overflow:hidden}.msg{margin:3px 0}.msg b{color:#fff}.chatbox{pointer-events:auto;margin-top:5px;width:100%;padding:8px;border-radius:8px;border:0;box-sizing:border-box}
</style>
</head>
<body>
<div id="hud"><div id="brand">🐢 TURTLENECK WORLD</div><div id="worldLabel"></div><span id="coords"></span></div>
<div id="players"></div><div id="crosshair">+</div>
<div id="help">WASD move · Mouse look · Left click break · Right click place · T chat · ESC unlock</div>
<div id="chat"><div id="messages"></div><input class="chatbox" id="chatInput" maxlength="120" placeholder="Press T to chat…"></div>
<div id="panel"><div id="card">
<h1>🐢 TURTLENECK WORLD</h1>
<p id="intro">Create a world, share its link on X, and everyone who opens that link can join the same multiplayer world.</p>
<input id="name" maxlength="18" placeholder="Your player name">
<button id="join">Enter World</button><button id="new" class="secondary">Create New World</button>
<div id="status"></div><button id="share">Copy World Link</button>
</div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.180.0/build/three.module.js";
const pathParts=location.pathname.split('/').filter(Boolean); let worldId=pathParts[0]==='world'&&pathParts[1]?pathParts[1].slice(0,32):'';
const worldLabel=document.getElementById('worldLabel');
function makeWorldId(){return Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6)}
if(worldId) worldLabel.textContent='World: '+worldId; else {document.getElementById('join').style.display='none';document.getElementById('name').style.display='none';document.getElementById('intro').textContent='Create your own TURTLENECK world, then share its link on X.';}
document.getElementById('new').onclick=()=>location.href='/world/'+makeWorldId();
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x8fc7e8); scene.fog=new THREE.Fog(0x8fc7e8,35,100);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,150);camera.position.set(0,2.2,6);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x35502b,1.5));const sun=new THREE.DirectionalLight(0xffffff,1.7);sun.position.set(15,30,10);sun.castShadow=true;scene.add(sun);
const boxGeo=new THREE.BoxGeometry(1,1,1);const mats={grass:new THREE.MeshLambertMaterial({color:0x55a84f}),dirt:new THREE.MeshLambertMaterial({color:0x8b5a2b}),stone:new THREE.MeshLambertMaterial({color:0x777b80}),wood:new THREE.MeshLambertMaterial({color:0x8d623d}),shell:new THREE.MeshLambertMaterial({color:0x3d8b72})};
const blocks=new Map(),meshes=new Map();function key(x,y,z){return `${x},${y},${z}`}
function addBlock(x,y,z,type='grass',broadcast=true){const k=key(x,y,z);if(blocks.has(k))return;blocks.set(k,type);const m=new THREE.Mesh(boxGeo,mats[type]||mats.grass);m.position.set(x+.5,y+.5,z+.5);m.castShadow=true;m.receiveShadow=true;m.userData.block={x,y,z,type};scene.add(m);meshes.set(k,m);if(broadcast)send({type:'block',action:'add',x,y,z,blockType:type})}
function removeBlock(x,y,z,broadcast=true){const k=key(x,y,z),m=meshes.get(k);if(!m)return;scene.remove(m);meshes.delete(k);blocks.delete(k);if(broadcast)send({type:'block',action:'remove',x,y,z})}
for(let x=-14;x<14;x++)for(let z=-14;z<14;z++){addBlock(x,0,z,'grass',false);if((x*7+z*3)%19===0)addBlock(x,1,z,'dirt',false)}
const keysDown={};let yaw=0,pitch=0;const velocity=new THREE.Vector3();let joined=false,ws=null,myId=null,playerName='';const remote={};
addEventListener('keydown',e=>{if(e.code==='KeyT'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('chatInput').focus();return}keysDown[e.code]=true});addEventListener('keyup',e=>{keysDown[e.code]=false});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('join').onclick=()=>{playerName=(document.getElementById('name').value.trim()||'Player').slice(0,18);connect()};
document.getElementById('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('status').textContent='World link copied! Post it on X.'}catch{document.getElementById('status').textContent=location.href}};
function connect(){if(!worldId){worldId=makeWorldId();history.replaceState({},'',`/world/${worldId}`);worldLabel.textContent='World: '+worldId}const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}?world=${encodeURIComponent(worldId)}`);document.getElementById('status').textContent='Connecting…';ws.onopen=()=>{joined=true;document.getElementById('panel').style.display='none';ws.send(JSON.stringify({type:'join',name:playerName,x:0,y:2,z:5}));renderer.domElement.requestPointerLock?.()};ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=()=>{document.getElementById('status').textContent='Disconnected. Refresh to reconnect.';document.getElementById('panel').style.display='flex';joined=false};ws.onerror=()=>{document.getElementById('status').textContent='Connection failed.'}}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function makeRemote(p){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.65,1.2,.45),new THREE.MeshLambertMaterial({color:p.color||0x38a77e}));body.position.y=.6;body.castShadow=true;g.add(body);const label=document.createElement('div');label.style.cssText='position:fixed;z-index:8;color:white;font-weight:bold;font-size:12px;text-shadow:0 1px 3px #000;pointer-events:none';label.textContent=p.name||'Player';document.body.appendChild(label);g.userData.label=label;scene.add(g);remote[p.id]=g;return g}
function updateRemote(p){const g=remote[p.id]||makeRemote(p);g.position.set(p.x,p.y,p.z)}function removeRemote(id){if(!remote[id])return;document.body.removeChild(remote[id].userData.label);scene.remove(remote[id]);delete remote[id]}
function chat(name,msg){const d=document.createElement('div');d.className='msg';d.innerHTML='<b>'+escapeHtml(name)+':</b> '+escapeHtml(msg);document.getElementById('messages').appendChild(d);while(document.getElementById('messages').children.length>7)document.getElementById('messages').firstChild.remove()}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function handle(m){if(m.type==='welcome'){myId=m.id;(m.players||[]).forEach(updateRemote);(m.blocks||[]).forEach(b=>b.action==='remove'?removeBlock(b.x,b.y,b.z,false):addBlock(b.x,b.y,b.z,b.blockType,false));chat('SYSTEM','Welcome to '+worldId)}if(m.type==='player')updateRemote(m);if(m.type==='leave')removeRemote(m.id);if(m.type==='block')m.action==='remove'?removeBlock(m.x,m.y,m.z,false):addBlock(m.x,m.y,m.z,m.blockType||'grass',false);if(m.type==='players')document.getElementById('players').textContent=`🐢 ${m.count} player${m.count===1?'':'s'} online`;if(m.type==='chat')chat(m.name,m.message)}
renderer.domElement.addEventListener('mousedown',e=>{if(!joined)return;if(document.pointerLockElement!==renderer.domElement){renderer.domElement.requestPointerLock();return}const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects([...meshes.values()]);if(!hits.length||hits[0].distance>7)return;const b=hits[0].object.userData.block;if(e.button===0){if(b.y>0)removeBlock(b.x,b.y,b.z)}else if(e.button===2){const n=hits[0].face.normal;addBlock(b.x+n.x,b.y+n.y,b.z+n.z,'grass')}});
addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement)return;yaw-=e.movementX*.002;pitch-=e.movementY*.002;pitch=Math.max(-1.45,Math.min(1.45,pitch));camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch});
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v){send({type:'chat',message:v});e.target.value='';}renderer.domElement.requestPointerLock?.()}});
function loop(){requestAnimationFrame(loop);if(joined){const dir=new THREE.Vector3();if(keysDown.KeyW)dir.z-=1;if(keysDown.KeyS)dir.z+=1;if(keysDown.KeyA)dir.x-=1;if(keysDown.KeyD)dir.x+=1;if(dir.length())dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);velocity.x=dir.x*.12;velocity.z=dir.z*.12;camera.position.x+=velocity.x;camera.position.z+=velocity.z;camera.position.y=2.2;send({type:'move',x:camera.position.x,y:camera.position.y,z:camera.position.z,rot:yaw});document.getElementById('coords').textContent=`x ${camera.position.x.toFixed(1)} · z ${camera.position.z.toFixed(1)}`;Object.values(remote).forEach(g=>{const v=g.position.clone().add(new THREE.Vector3(0,1.6,0)).project(camera);g.userData.label.style.left=((v.x*.5+.5)*innerWidth-30)+'px';g.userData.label.style.top=((-v.y*.5+.5)*innerHeight-20)+'px'})}renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
